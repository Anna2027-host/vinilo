<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vinilo | Restó Bar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="header">

        <div class="header-principal">

            <div class="logo-vinilo">
                <div class="vinilo-titulo">VINILO</div>
                <div class="vinilo-subtitulo">RESTÓ BAR • PUB</div>
            </div>

        </div>

        <!-- UBICACIÓN -->
        <a
            class="ubicacion"
            href="https://www.google.com/maps/search/?api=1&query=Blvd.%20Sta.%20Fe%20272%2C%20X2426%20La%20Francia%2C%20C%C3%B3rdoba"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span>📍 BLVD. STA. FE 272 • LA FRANCIA, CBA</span>
            <small>Ver ubicación en Google Maps →</small>
        </a>

    </header>


    <!-- CATEGORÍAS -->
    <main>

        <section class="categorias">

            <button class="categoria" onclick="mostrarCategoria('Pizzas')">
                <span class="categoria-icono">🍕</span>
                <span>Pizzas</span>
            </button>

            <button class="categoria" onclick="mostrarCategoria('Empanadas')">
                <span class="categoria-icono">🥟</span>
                <span>Empanadas</span>
            </button>

            <button class="categoria" onclick="mostrarCategoria('Sandwiches')">
                <span class="categoria-icono">🥪</span>
                <span>Sanguches</span>
            </button>

            <button class="categoria" onclick="mostrarCategoria('Papas')">
                <span class="categoria-icono">🍟</span>
                <span>Papas</span>
            </button>

            <button class="categoria" onclick="mostrarCategoria('Bebidas')">
                <span class="categoria-icono">🥤</span>
                <span>Bebidas</span>
            </button>

            <button class="categoria" onclick="mostrarCategoria('Postres')">
                <span class="categoria-icono">🍰</span>
                <span>Postres</span>
            </button>

        </section>


        <!-- PRODUCTOS -->
        <section id="productos" class="productos">
        </section>

    </main>


    <!-- ========================= -->
    <!-- MODAL CARRITO -->
    <!-- ========================= -->

    <div id="modalCarrito" class="modal">

        <div class="modal-contenido">

            <button class="cerrar-modal" onclick="cerrarCarrito()">×</button>

            <h2>Mi pedido 🛒</h2>

            <div id="listaCarrito" class="lista-carrito"></div>

            <div id="totalCarrito" class="total-carrito">
                Total: $0
            </div>


            <div class="formulario-pedido">

                <label for="nombreCliente">
                    Nombre *
                </label>

                <input
                    type="text"
                    id="nombreCliente"
                    placeholder="Ingresá tu nombre"
                    required
                >


                <label for="tipoPedido">
                    Tipo de pedido *
                </label>

                <select
                    id="tipoPedido"
                    onchange="actualizarDireccion()"
                    required
                >
                    <option value="">Seleccioná una opción</option>
                    <option value="Delivery">Delivery</option>
                    <option value="Retiro por el local">Retiro por el local</option>
                </select>


                <div
                    id="contenedorDireccion"
                    class="campo-direccion"
                    style="display: none;"
                >

                    <label for="direccionCliente">
                        Dirección *
                    </label>

                    <input
                        type="text"
                        id="direccionCliente"
                        placeholder="Ingresá tu dirección"
                    >

                </div>


                <label for="formaPago">
                    Forma de pago *
                </label>

                <select id="formaPago" required>

                    <option value="">
                        Seleccioná una opción
                    </option>

                    <option value="Efectivo">
                        Efectivo
                    </option>

                    <option value="Transferencia">
                        Transferencia
                    </option>

                    <option value="Mercado Pago">
                        Mercado Pago
                    </option>

                </select>


                <label for="observaciones">
                    Observaciones
                </label>

                <textarea
                    id="observaciones"
                    placeholder="Ej: sin cebolla, tocar timbre, etc."
                ></textarea>


                <button
                    id="boton-whatsapp"
                    class="boton-whatsapp"
                    onclick="enviarWhatsApp()"
                >
                    ENVIAR PEDIDO POR WHATSAPP
                </button>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- MODAL EMPANADAS -->
    <!-- ========================= -->

    <div id="modalEmpanadas" class="modal">

        <div class="modal-contenido modal-empanadas">

            <button
                class="cerrar-modal"
                onclick="cerrarModalEmpanadas()"
            >
                ×
            </button>

            <h2 id="tituloEmpanadas">
                Elegí tus empanadas 🥟
            </h2>

            <p id="textoEmpanadas">
                Elegí los gustos para completar tu pedido.
            </p>

            <div id="packs-empanadas" class="packs-empanadas">
            </div>

            <div id="seleccionEmpanadas">
            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- MODAL PERFIL -->
    <!-- ========================= -->

    <div id="modalPerfil" class="modal">

        <div class="modal-contenido">

            <button
                class="cerrar-modal"
                onclick="cerrarPerfil()"
            >
                ×
            </button>

            <h2>Mi perfil 👤</h2>

            <div class="formulario-pedido">

                <label for="perfilNombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="perfilNombre"
                    placeholder="Nombre"
                >


                <label for="perfilApellido">
                    Apellido
                </label>

                <input
                    type="text"
                    id="perfilApellido"
                    placeholder="Apellido"
                >


                <label for="perfilTelefono">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="perfilTelefono"
                    placeholder="Teléfono"
                >


                <button
                    id="boton-guardar"
                    class="boton-guardar"
                    onclick="guardarPerfil()"
                >
                    GUARDAR DATOS
                </button>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- MODAL PREMIOS -->
    <!-- ========================= -->

    <div id="modalRecompensas" class="modal">

        <div class="modal-contenido modal-recompensas">

            <button
                class="cerrar-modal"
                onclick="cerrarRecompensas()"
            >
                ×
            </button>

            <div class="recompensas-icono">
                ⭐
            </div>

            <h2>
                Premios
            </h2>

            <p class="puntos-proximamente">
                Próximamente vas a poder sumar puntos con tus pedidos y canjear beneficios exclusivos.
            </p>

        </div>

    </div>


    <!-- ========================= -->
    <!-- INSTAGRAM -->
    <!-- ========================= -->

    <!-- No ponemos Instagram -->


    <!-- ========================= -->
    <!-- BARRA INFERIOR -->
    <!-- ========================= -->

    <nav class="bottom-nav">

        <button
            class="nav-item"
            onclick="irInicio()"
        >
            <span>⌂</span>
            <small>Inicio</small>
        </button>


        <button
            class="nav-item nav-carrito"
            onclick="abrirCarrito()"
        >
            <span>🛒</span>
            <small>Carrito</small>

            <b
                id="contadorCarrito"
                class="contador-carrito"
            >
                0
            </b>

        </button>


        <button
            class="nav-item"
            onclick="abrirRecompensas()"
        >
            <span>⭐</span>
            <small>Premios</small>
        </button>


        <button
            class="nav-item"
            onclick="abrirPerfil()"
        >
            <span>👤</span>
            <small>Perfil</small>
        </button>

    </nav>


    <!-- DIRECCIÓN DELIVERY -->
    <script>

        function actualizarDireccion() {

            const tipo = document.getElementById("tipoPedido");
            const contenedor = document.getElementById("contenedorDireccion");
            const direccion = document.getElementById("direccionCliente");

            if (!tipo || !contenedor || !direccion) {
                return;
            }

            if (tipo.value === "Delivery") {

                contenedor.style.display = "block";
                direccion.required = true;

            } else {

                contenedor.style.display = "none";
                direccion.required = false;
                direccion.value = "";

            }

        }


        document.addEventListener(
            "DOMContentLoaded",
            function () {
                actualizarDireccion();
            }
        );

    </script>


    <script src="script.js"></script>

</body>
</html>
